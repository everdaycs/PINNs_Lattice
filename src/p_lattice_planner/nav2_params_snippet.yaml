# nav2_params.yaml snippet
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased", "LatticePlanner"]
    use_sim_time: true
    
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

    LatticePlanner:
      plugin: "p_lattice_planner::LatticePlanner"
      tolerance: 0.5
      allow_unknown: true
      max_planning_time_ms: 2000
      use_astar: true
