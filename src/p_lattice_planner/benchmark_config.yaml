# benchmark_config.yaml (Example structure based on nav2_planner_benchmarking usage)
# This usually maps to ROS parameters needed by the benchmarking node.
planner_benchmarking:
  ros__parameters:
    planners: ["GridBased", "LatticePlanner"]
    planner_map:
      GridBased: "nav2_navfn_planner/NavfnPlanner"
      LatticePlanner: "p_lattice_planner::LatticePlanner"
    
    # Specific plugin configs (same as nav2_params)
    GridBased:
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

    LatticePlanner:
      tolerance: 0.5
      allow_unknown: true
      max_planning_time_ms: 2000
      use_astar: true

    # Global Costmap for Planner Server
    global_costmap:
      global_costmap:
        ros__parameters:
          update_frequency: 1.0
          publish_frequency: 1.0
          global_frame: map
          robot_base_frame: base_link
          use_sim_time: true
          robot_radius: 0.1
          resolution: 0.05
          track_unknown_space: true
          plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
          static_layer:
            plugin: "nav2_costmap_2d::StaticLayer"
            map_subscribe_transient_local: True
          obstacle_layer:
            plugin: "nav2_costmap_2d::ObstacleLayer"
            enabled: True
          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            cost_scaling_factor: 3.0
            inflation_radius: 0.55
