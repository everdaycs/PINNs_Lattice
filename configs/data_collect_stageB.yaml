# Stage B (Environment Interaction) Data Collection Config

num_samples: 2000
batch_size: 1000
num_workers: 4
output_dir: "data/pinn_lattice_dataset/stageB"
seed: 1024

map:
  yaml_path: "/home/kaga/Desktop/PINNs_Lattice/src/saye_bringup/maps/map.yaml" # Corrected path
  cost_threshold: 253 # 障碍物判定阈值
  padding: 0.2 # 膨胀半径 (m)

search:
  max_expansions: 5000  # 每次搜索最大扩展节点数
  prob_sample: 0.2      # 对每条候选边采样的概率 (Downsampling)
  hard_mining: true     # 是否对高 Cost 区域提高采样率

rollout:
  dt: 0.05
  tracking_controller: "pure_pursuit"
  lookahead_dist: 0.4
  mu_range: [0.2, 0.8]
  v0_range: [0.5, 2.0]

vehicle:
  wheelbase: 0.2255
  max_steering_angle: 0.40
  track_width: 0.20
  footprint: [[0.15, 0.09], [0.15, -0.09], [-0.15, -0.09], [-0.15, 0.09]] # 简化的矩形

primitive:
  R_min: 0.533
  spatial_resolution: 0.05
  num_headings: 16
